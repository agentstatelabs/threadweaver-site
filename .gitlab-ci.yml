# CI for ThreadWeaver-site (static landing page — no build step)
stages:
  - check

verify:
  stage: check
  image: alpine:latest
  script:
    - 'test -f landing/index.html && echo "ThreadWeaver-site landing/index.html present"'
# --- added by batch-publish-sites: leak-scan-gated publish to GitHub ---
# Uses reserved stage .post (no need to touch the existing stages list).
# Requires CI vars GITHUB_REPO, GITHUB_TOKEN, and file-var LEAKSCAN_LOCAL.
publish-github:
  stage: .post
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git bash grep curl
  script:
    - printf '%s' "$LEAKSCAN_LOCAL" > .leakscan.local
    - chmod +x scripts/leak-scan.sh scripts/publish-to-github.sh
    - ./scripts/publish-to-github.sh
# ci-guard: guarantees a NON-EMPTY pipeline and fails loudly if the publish
# prerequisites are missing. Without this, a mis-scoped publish job produces
# no pipeline at all — silent, and easy to miss for days.
ci-guard:
  stage: check
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "pipeline ran for $CI_COMMIT_SHORT_SHA on $CI_COMMIT_BRANCH"
    - |
      if [ -z "$GITHUB_REPO" ]; then
        echo "ERROR: GITHUB_REPO unset -> publish-github will NOT run"; exit 1
      fi
      echo "publish-github target: $GITHUB_REPO"

# Dispatch the GitHub Pages build AFTER publish-github mirrors main to GitHub.
# GitHub's native push trigger does not fire reliably for mirror pushes, so the
# site silently served a stale build. `needs` guarantees the mirror lands first,
# otherwise the Action rebuilds the previous commit.
trigger-github-pages:
  stage: .post
  image: curlimages/curl:latest
  needs: ["publish-github"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_REPO'
  script:
    - |
      curl -fsS -X POST \
        -H "Authorization: Bearer $GH_PAT" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/deploy-landing.yml/dispatches" \
        -d '{"ref":"main"}'
    - echo "Dispatched deploy-landing.yml on $GITHUB_REPO"
